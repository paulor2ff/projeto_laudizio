name: Build Executáveis

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: write

jobs:
  build:

    strategy:
      matrix:
        include:
          - os: windows-latest
            script: build/build_nuitka.bat

          - os: ubuntu-latest
            script: bash build/build_nuitka.sh

          - os: macos-latest
            script: bash build/build_nuitka.sh

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: plataforma_opcoes

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

        # NOVO:
        # Cache das dependências Python
        cache: "pip"
        cache-dependency-path: plataforma_opcoes/requirements-build.txt


    - name: Atualizar pip
      run: |
        python -m pip install --upgrade pip


    - name: Instalar dependências
      run: |
        pip install -r requirements-build.txt


    # NOVO:
    # Verificação antes da compilação
    - name: Verificar estrutura do projeto
      run: |
        echo "Sistema operacional:"
        python --version

        echo "Diretório atual:"
        pwd

        echo "Arquivos:"
        ls -la

        echo "Scripts de build:"
        ls -la build/


    # NOVO:
    # Executa testes básicos antes de empacotar
    - name: Validar projeto
      run: |
        python -m compileall .


    - name: Compilar executável
      run: |
        ${{ matrix.script }}


    # NOVO:
    # Mostra resultado do build
    - name: Verificar saída do build
      run: |
        echo "Conteúdo da pasta dist:"
        ls -la dist/


    - name: Publicar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: executavel-${{ matrix.os }}-${{ github.ref_name }}
        path: plataforma_opcoes/dist/
        retention-days: 30