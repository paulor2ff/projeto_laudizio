name: Build Executáveis

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:

    strategy:
      matrix:
        include:
          - os: windows-latest
            script: build/build_nuitka.bat

          - os: ubuntu-latest
            script: bash build/build_nuitka.sh

          - os: macos-latest
            script: bash build/build_nuitka.sh

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: plataforma_opcoes

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Atualizar pip
      run:
        python -m pip install --upgrade pip

    - name: Instalar dependências
      run: |
        pip install -r requirements-build.txt

    - name: Compilar executável
      run: |
        ${{ matrix.script }}

    - name: Publicar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: executavel-${{ matrix.os }}
        path: plataforma_opcoes/dist/