name: Build Executáveis

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: write

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash
        working-directory: plataforma_opcoes

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: plataforma_opcoes/requirements-build.txt

      - name: Atualizar pip
        run: |
          python -m pip install --upgrade pip

      - name: Instalar dependências
        run: |
          pip install -r requirements-build.txt

      - name: Verificar estrutura do projeto
        run: |
          echo "Diretório atual:"
          pwd

          echo ""
          echo "Conteúdo:"
          ls -la

          echo ""
          echo "Conteúdo da pasta scripts:"
          ls -la scripts

      - name: Validar sintaxe do projeto
        run: |
          python -m compileall .

      - name: Dar permissão ao script
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/build_nuitka.sh

      - name: Compilar executável
        run: |
          bash scripts/build_nuitka.sh

      - name: Verificar artefatos gerados
        run: |
          if [ -d dist ]; then
            echo "Conteúdo da pasta dist:"
            ls -R dist
          else
            echo "A pasta dist não foi criada."
            exit 1
          fi

      - name: Publicar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: executavel-${{ matrix.os }}-${{ github.ref_name }}
          path: plataforma_opcoes/dist/
          if-no-files-found: error
          retention-days: 30