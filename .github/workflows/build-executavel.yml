name: Build Executáveis

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:

    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-build.txt

    - name: Compilar executável
      run: |
        python build.py

    - name: Publicar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: executavel-${{ matrix.os }}
        path: dist/